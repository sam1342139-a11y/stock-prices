name: fcn-monitor
# 每日股價（update-prices）跑完後自動執行，計算 FCN 燈號並寄 Email
# 商品條件與信箱設定都放在 GitHub 密鑰，不會出現在檔案或執行紀錄裡
on:
  workflow_run:
    workflows: [update-prices]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 fcn-monitor/monitor.py
        env:
          FCN_PRODUCTS: ${{ secrets.FCN_PRODUCTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
