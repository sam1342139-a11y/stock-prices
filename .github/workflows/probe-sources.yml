name: probe-sources
# TEMPORARY: one-time backfill of tw/closes on this branch. Will be removed before merge.
on:
  push:
    branches: [claude/cloud-environment-setup-k7cvox]
    paths: [.github/workflows/probe-sources.yml]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tw/closes.py --backfill 2026-10-01
      - run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tw/closes
          git commit -m "backfill tw closes since 2026-10-01" && git push
