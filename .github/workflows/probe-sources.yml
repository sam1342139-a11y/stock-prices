name: probe-sources
# TEMPORARY: runs the new FCN feed scripts once on this branch (no commit). Will be removed before merge.
on:
  push:
    branches: [claude/cloud-environment-setup-k7cvox]
    paths: [.github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: run
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python3 fcn/check_prices.py
          python3 -c "import json;d=json.load(open('fcn/prices_checked.json'));print('PRICES', d['status'], d['fx'], d['problems'])"
          python3 news/fetch_news.py
          python3 -c "
          import json;d=json.load(open('news/raw.json'));print('NEWS', d['window_tw'], d['count'], d['problems'])
          for x in d['items'][:8]: print(x)
          print([x for x in d['items'] if x.get('tickers')][:6])"
          python3 earnings/fetch_calendar.py
          python3 -c "
          import json;d=json.load(open('earnings/calendar.json'));print('CAL problems', d['problems'])
          print('RECENT', d['recent'])
          for x in d['all']: print(x['date'], x['ticker'], x['event'], x['time'], x.get('period'), x['confirmed'])"
          python3 earnings/tw_financials.py
