name: probe-sources
# TEMPORARY: runs the new price check once on this branch (no commit). Will be removed before merge.
on:
  push:
    branches: [claude/cloud-environment-setup-k7cvox]
    paths: [.github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: run
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          python3 fcn/check_prices.py
          python3 -c "
          import json;d=json.load(open('fcn/prices_checked.json'))
          print('STATUS', d['status'], d['fail_reasons'], d['problems'])
          print('MISMATCH', d['mismatch'])
          print('SPLITS', [(s['ticker'], s['ratio'], s['effective_date']) for s in d['splits']])
          print('FX', d['fx'])"
