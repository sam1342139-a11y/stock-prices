name: research-v11
# Taiwan model v1.1 RESEARCH (walk-forward validation + swing candidates). Research only:
# does not touch tw-models/config.json, tw-models/latest/ or any daily schedule.
# Runs on a push that changes tw-models/research/RUN (on a claude/* branch) or manually.
# Results (docs/RESEARCH_v1.1.md, docs/img/RESEARCH_v11.png, tw-models/research/results_v11.json) are committed to the
# branch it ran on; a manual run on main pushes them to branch research/v11-results instead (review via a PR).
on:
  push:
    branches: ['claude/**']
    paths: [tw-models/research/RUN]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: plotting package
        continue-on-error: true
        run: python3 -m pip install --quiet --user --break-system-packages matplotlib || python3 -m pip install --quiet --user matplotlib
      - name: restore raw data (read only)
        uses: actions/cache/restore@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
          restore-keys: tw-models-data-
      - name: fonts for Chinese labels
        continue-on-error: true
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk) >/dev/null 2>&1 || true
      - run: python3 tw-models/research/v11.py
      - name: save results
        run: |
          git config user.name "research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/RESEARCH_v1.1.md docs/img/RESEARCH_v11.png tw-models/research/results_v11.json
          git commit -m "research v1.1 results" || exit 0
          if [ "${{ github.ref_name }}" = "main" ]; then
            git push origin HEAD:refs/heads/research/v11-results --force
          else
            for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0; sleep 10; done
            exit 1
          fi
