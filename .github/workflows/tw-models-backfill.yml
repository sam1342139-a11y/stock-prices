name: tw-models-backfill
# One-time historical backfill from FinMind into the Actions cache (not committed).
# Runs hourly; each run keeps going up to ~5.5 hours (request pacing keeps it under the free 600/hour limit)
# and resumes from saved progress, so a late or skipped hourly schedule does not slow the backfill.
# Each run stops before 10:20 / 13:20 / 15:20 UTC so it never blocks the daily update and its backup runs (same concurrency group).
# Once everything is fetched, each hourly run exits within seconds.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: tw-models-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: restore raw data
        uses: actions/cache/restore@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
          restore-keys: tw-models-data-
      - name: check progress
        id: chk
        run: |
          python3 - <<'PY'
          import json, os
          p = "tw-models/data/meta/backfill_state.json"
          s = json.load(open(p)) if os.path.exists(p) else {}
          done = bool(s) and all(v == 0 for v in s.get("remaining", {"x": 1}).values())
          open(os.environ["GITHUB_OUTPUT"], "a").write("done=%s\n" % ("true" if done else "false"))
          print("remaining:", s.get("remaining"))
          PY
      - name: backfill batch
        if: steps.chk.outputs.done != 'true'
        run: |
          # budget: up to 330 minutes, but stop 10 minutes before each daily-update window
          # (10:30 / 13:30 / 15:30 UTC; same concurrency group, so a long backfill would block it)
          now=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          until=1440
          for w in 620 800 920; do u=$(( (w - now + 1440) % 1440 )); [ "$u" -lt "$until" ] && until=$u; done
          budget=$(( until - 5 < 330 ? until - 5 : 330 ))
          if [ "$budget" -lt 5 ]; then echo "too close to a daily-update window, skipping this hour"; exit 0; fi
          echo "budget ${budget} minutes"
          python3 tw-models/fetch_history.py --budget-min "$budget"
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: save raw data
        if: steps.chk.outputs.done != 'true'
        uses: actions/cache/save@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
