name: tw-models-spot-check
# Acceptance check (manual): compare cached data with the TWSE website for a few days (few requests). Results in the run log.
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
          restore-keys: tw-models-data-
      - run: python3 tw-models/spot_check.py
