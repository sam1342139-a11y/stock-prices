name: update-earnings
# Earnings calendar: scheduled run disabled (user uses MacroMicro's calendar instead).
# Manual run only. To re-enable: add back  schedule: - cron: '50 22 * * *'  (Taiwan 06:50 daily)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 calendar/fetch_earnings.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calendar/
          git commit -m "update earnings" || exit 0
          # 多個排程可能同時寫入 main：先合併最新版本再推送，失敗就稍等重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
