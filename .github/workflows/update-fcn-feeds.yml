name: update-fcn-feeds
# FCN morning helpers (no AI): news headlines, earnings calendar, Taiwan financials. Daily 05:20 Taiwan (21:20 UTC), backup 06:20.
on:
  schedule:
    # 21:20 UTC main (Taiwan 05:20), 22:20 UTC backup: scheduled runs were landing ~55 min late (07:13-07:17 Taiwan)
    - cron: '20 21 * * *'
    - cron: '20 22 * * *'
  workflow_dispatch:
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: news headlines
        continue-on-error: true
        run: python3 news/fetch_news.py
      - name: earnings calendar
        continue-on-error: true
        run: python3 earnings/fetch_calendar.py
      - name: Taiwan financials
        continue-on-error: true
        run: python3 earnings/tw_financials.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: save result
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news/raw.json news/tw_stocks.json earnings/calendar.json earnings/tw_financials.json || true
          git commit -m "update fcn feeds" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
