name: update-financials
# Quarterly financial statements for the financials watchlist (financials/watchlist.json) -> financials/tw/<code>.json
# Daily 18:50 Taiwan (10:50 UTC); statements change only when companies file, monthly revenue around the 10th.
# Manual run: type codes (e.g. "2603 2002") to fetch extra companies once, without changing the watchlist.
on:
  schedule:
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      codes:
        description: '臨時查詢的台股代號（空白分隔，留空＝追蹤清單）'
        required: false
        default: ''
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Taiwan statements
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          CODES: ${{ github.event.inputs.codes }}
        run: python3 financials/tw_fetch.py $CODES
      - name: save result
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add financials/
          git commit -m "update financials" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
