name: update-macro
# 每個平日 UTC 21:50（台灣時間週二～週六 05:50）抓總經數據，22:50 備援
# 與每日股價排程（06:30）共用同一個 concurrency 群組：兩者排隊依序執行，不會同時寫入造成衝突
on:
  schedule:
    # 21:50 UTC main, 22:50 UTC backup (Taiwan 05:50 / 06:50), so data is committed well before 07:15
    - cron: '50 21 * * 1-5'
    - cron: '50 22 * * 1-5'
  workflow_dispatch:
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 macro/fetch_macro.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        run: |
          git config user.name "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add macro/macro.json
          git commit -m "update macro" || exit 0
          git pull --rebase origin main
          git push
