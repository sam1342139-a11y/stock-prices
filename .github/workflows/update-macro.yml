name: update-macro
# 每個平日 UTC 23:20（台灣時間週二～週六 07:20）抓總經數據
# 刻意跟每日股價排程（06:30）錯開，避免兩個排程同時寫入造成衝突
on:
  schedule:
    - cron: '20 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 macro/fetch_macro.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        run: |
          git config user.name "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add macro/macro.json
          git commit -m "update macro" || exit 0
          git pull --rebase origin main
          git push
