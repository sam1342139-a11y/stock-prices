name: update-prices
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_prices.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.json
          git commit -m "update prices" || echo "no changes"
          git push
