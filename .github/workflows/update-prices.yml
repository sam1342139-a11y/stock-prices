name: update-prices
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
# 與總經排程共用同一個群組：兩者排隊依序執行，避免同時寫入 main 造成推送失敗
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_prices.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.json
          git commit -m "update prices" || echo "no changes"
          # 其他排程（匯率、財報、風險燈號）可能同時寫入 main：先合併最新版本再推送，失敗就稍等重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
