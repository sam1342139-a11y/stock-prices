name: update-prices
on:
  schedule:
    # 21:45 UTC (Taiwan 05:45) main run; 22:45 UTC backup only if the main run did not leave a fresh complete file
    - cron: '45 21 * * 1-5'
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
# 與總經排程共用同一個群組：兩者排隊依序執行，避免同時寫入 main 造成推送失敗
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: skip backup if already fresh
        id: fresh
        if: github.event_name == 'schedule' && github.event.schedule == '45 22 * * 1-5'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          d = json.load(open('latest.json'))
          t = datetime.datetime.strptime(d.get('fetched_at_utc', '1970-01-01 00:00:00'), '%Y-%m-%d %H:%M:%S')
          fresh = d.get('complete') and datetime.datetime.utcnow() - t < datetime.timedelta(hours=3)
          print('skip=%s' % ('true' if fresh else 'false'))
          PY
      - run: python3 fetch_prices.py
        if: steps.fresh.outputs.skip != 'true'
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      # FCN morning helper: checks of latest.json -> fcn/prices_checked.json (latest.json itself unchanged)
      - name: check prices for FCN
        if: always() && steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python3 fcn/check_prices.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.json
          git add fcn/prices_checked.json || true
          git commit -m "update prices" || echo "no changes"
          # 其他排程（匯率、財報、風險燈號）可能同時寫入 main：先合併最新版本再推送，失敗就稍等重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
