name: update-regime
# 市場風險燈號：週二～六台灣 06:05（UTC 22:05，週一～五），07:05 備援
on:
  schedule:
    # 22:05 UTC main, 23:05 UTC backup (Taiwan 06:05 / 07:05)
    - cron: '5 22 * * 1-5'
    - cron: '5 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 regime/fetch_regime.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save result
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add regime/
          git commit -m "update regime" || exit 0
          # 多個排程可能同時寫入 main：先合併最新版本再推送，失敗就稍等重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
