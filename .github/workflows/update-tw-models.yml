name: update-tw-models
# Taiwan model data: weekdays 18:30 Taiwan (UTC 10:30). Appends today's data, refreshes SOXX/USD-TWD and regime_tw.
# Fridays (or manual run): swing / long lists (tw-models/models.py --latest).
# Raw data is NOT committed (FinMind terms do not clearly allow public redistribution); it lives in the Actions cache.
# Only computed outputs (tw-models/latest/) are committed.
on:
  schedule:
    # 18:30 Taiwan, plus backup runs at 21:30 and 23:30 Taiwan: GitHub often delays scheduled runs, and this job
    # shares a concurrency group with the backfill, so a late run can be stuck or replaced. Appending is idempotent
    # (upsert by date+code) and the TWSE endpoints return the latest trading day, so a later run still gets today's data.
    - cron: '30 10 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: tw-models-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: optional packages (quantstats reports, pandera checks)
        continue-on-error: true
        run: python3 -m pip install --quiet --user --break-system-packages -r tw-models/requirements.txt || python3 -m pip install --quiet --user -r tw-models/requirements.txt
      - name: restore raw data
        uses: actions/cache/restore@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
          restore-keys: tw-models-data-
      - name: check backfill
        id: chk
        run: |
          python3 - <<'PY'
          import json, os
          p = "tw-models/data/meta/backfill_state.json"
          s = json.load(open(p)) if os.path.exists(p) else {}
          done = bool(s) and (s.get("initial_complete") or all(v == 0 for v in s.get("remaining", {"x": 1}).values()))
          import datetime
          tw = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          lists = tw.weekday() == 4 or os.environ.get("EVENT") == "workflow_dispatch"
          open(os.environ["GITHUB_OUTPUT"], "a").write("ready=%s\nlists=%s\n" % ("true" if done else "false", "true" if lists else "false"))
          print("backfill complete:", done, "| lists today:", lists)
          PY
        env:
          EVENT: ${{ github.event_name }}
      - name: append today's data
        run: python3 tw-models/update_daily.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: US market series (SOXX, USD/TWD)
        run: python3 tw-models/fetch_us_market.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: regime_tw
        if: steps.chk.outputs.ready == 'true'
        run: python3 tw-models/regime_tw.py
      - name: after-market chip summary (daily)
        if: steps.chk.outputs.ready == 'true'
        run: python3 tw-models/after_market.py
      - name: 33-stock screen (daily)
        if: steps.chk.outputs.ready == 'true'
        run: python3 tw-models/models.py --screen
      - name: swing / long lists (Fridays)
        if: steps.chk.outputs.ready == 'true' && steps.chk.outputs.lists == 'true'
        run: python3 tw-models/models.py --latest
      - name: paper trading (simulated money)
        if: steps.chk.outputs.ready == 'true'
        run: python3 tw-models/paper.py
      - name: data checks (docs/DATA_CHECKS.md)
        id: sanity
        if: steps.chk.outputs.ready == 'true'
        run: |
          python3 tw-models/sanity.py check --out /tmp/sanity.json
          python3 -c "import json,os; r=json.load(open('/tmp/sanity.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('ok=%s\n' % ('true' if r['ok'] else 'false'))"
      - name: keep previous outputs when a check fails
        if: steps.chk.outputs.ready == 'true' && steps.sanity.outputs.ok == 'false'
        run: |
          git checkout HEAD -- tw-models/latest tw-models/paper
          if git cat-file -e HEAD:docs/PAPER.md 2>/dev/null; then git checkout HEAD -- docs/PAPER.md; fi
          python3 tw-models/sanity.py mark --report /tmp/sanity.json
      - name: save raw data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tw-models/data
          key: tw-models-data-${{ github.run_id }}
      - name: commit computed outputs only
        if: steps.chk.outputs.ready == 'true'
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tw-models/latest/
          if [ -d tw-models/paper ]; then git add tw-models/paper/; fi
          if [ -f docs/PAPER.md ]; then git add docs/PAPER.md; fi
          git commit -m "update tw-models outputs" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: open or update an issue when a check fails
        if: ${{ !cancelled() && steps.chk.outputs.ready == 'true' && steps.sanity.outputs.ok == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/sanity.json'))
          lines = ["資料檢查沒有通過，這次**沒有發布新資料**，各輸出檔維持前一次的內容，並在 problems 欄位寫明原因。", "",
                   "資料日期：%s" % r.get("date"), "", "**沒通過的項目**"] + ["- " + p for p in r["problems"]]
          if r.get("notes"):
              lines += ["", "**其他提醒（不擋發布）**"] + ["- " + n for n in r["notes"]]
          lines += ["", "檢查規則：docs/DATA_CHECKS.md。修正後重跑 update-tw-models，檢查通過就會恢復發布。",
                    "", "工作紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"]
          open('/tmp/issue.md', 'w').write("\n".join(lines))
          open('/tmp/title.txt', 'w').write("資料檢查未通過 %s" % r.get("date"))
          PY
          title="$(cat /tmp/title.txt)"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file /tmp/issue.md; else gh issue create --title "$title" --body-file /tmp/issue.md; fi
