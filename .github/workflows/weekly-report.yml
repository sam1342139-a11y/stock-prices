name: weekly-report
# Monday 06:10 Taiwan: tw-models/latest/weekly_report.md (copies the existing model outputs, no AI)
on:
  schedule:
    - cron: '10 22 * * 0'
  workflow_dispatch:
concurrency:
  group: write-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tw-models/weekly_report.py
      - name: save result
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tw-models/latest/weekly_report.md
          git commit -m "weekly report" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
